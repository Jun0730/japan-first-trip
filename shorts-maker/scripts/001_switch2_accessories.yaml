    image: ""
    image_search: Nintendo Switch 2 充電器
    link: ""
    boxes:
      - text: 携帯モードだと|2時間ほどで切れることも
        yomi: 携帯モードだと、二時間ほどで切れることも
      - text: ええとこで電池切れは|ほんまに萎える
        speaker: 2   # ツッコミは四国めたん

  - rank: 3
    name: Proコントローラー
    name_yomi: プロコントローラー
    image: ""
    image_search: Nintendo Switch 2 Proコントローラー
    link: ""
    boxes:
      - text: 背面ボタン付きで|アクションが一気に快適
      - text: 一回使ったら|もう戻られへん
        speaker: 2   # ツッコミは四国めたん

  - rank: 2
    name: 画面保護フィルム
    image: ""
    image_search: Nintendo Switch 2 保護フィルム
    link: ""
    boxes:
      - text: 大画面は一回傷がつくと|ずっと気になる
      - text: 本体と同じ日に|貼るのが正解
        speaker: 2   # ツッコミは四国めたん
        yomi: 本体と同じ日に貼るのが正解や

  - rank: 1
    name: microSD Express
    name_yomi: マイクロエスディーエクスプレス
    image: ""
    image_search: microSD Express 256GB
    link: ""
    boxes:
      - text: ソフトの保存は|microSD Expressしか|使えない
        yomi: ソフトの保存は、マイクロエスディーエクスプレスしか使えない
      - text: 前のSwitchのmicroSDは|使えへんから要注意
        speaker: 2   # ツッコミは四国めたん
        yomi: 前のスイッチのマイクロエスディーは、使えへんから要注意

  - type: ending
    lines:
      - みんなが
      - 1番買って
      - よかったのは
      - どれ？
      - コメントで
      - 教えてね！！
    narration:
      - 紹介した商品は、概要欄のリンクから見れるで。
      - みんなが一番買ってよかったのはどれ？コメントで教えてね！

hashtags: ["#Switch2", "#ニンテンドースイッチ2", "#周辺機器", "#ガジェット", "#買ってよかった"]
