# ─────────────────────────────────────────────
# 1本目：Switch2と一緒に買うべき周辺機器 TOP5
# ─────────────────────────────────────────────
# text : 画面に出る字幕
# yomi : 読み上げ用（読み間違えそうな時だけ書く。なければ text を読む）
# point: 画像がない時にカードに出す一言
# image: shorts-maker/images/ に置いた画像のファイル名（任意）
# link : アフィリエイトリンク（概要欄テキストに入る）

# 「|」の所で画面上のタイトルが改行されます
title: 【買う前に見て】Switch2と一緒に|買うべき周辺機器TOP5

scenes:
  - heading: 知らないと損！
    point: Switch2を買ったら
    lines:
      - text: Switch2買ったのに、これ買ってないのはもったいない！
        yomi: スイッチツー買ったのに、これ買ってないのはもったいない！
      - text: 一緒に買うべき周辺機器TOP5、1位は知らないと本気で損します。
        yomi: 一緒に買うべき周辺機器トップファイブ、一位は知らないと本気で損します。

  - rank: 5
    heading: キャリングケース
    point: 持ち歩くなら必須
    image: ""
    link: ""
    lines:
      - text: 第5位、キャリングケース。
        yomi: 第五位、キャリングケース。
      - text: 本体が大きくなったぶん、カバンの中でぶつけやすい。
      - text: 外に持ち出すなら、ケースは最初に買っておこう。

  - rank: 4
    heading: 充電器・バッテリー
    point: 充電切れ対策
    image: ""
    link: ""
    lines:
      - text: 第4位、急速充電対応の充電器とモバイルバッテリー。
        yomi: 第四位、急速充電対応の充電器とモバイルバッテリー。
      - text: 携帯モードは、ゲームによっては2時間ほどで電池が切れることも。
        yomi: 携帯モードは、ゲームによっては二時間ほどで電池が切れることも。
      - text: 出かける時のお守りに1つあると安心。
        yomi: 出かける時のお守りにひとつあると安心。

  - rank: 3
    heading: Proコントローラー
    point: 背面ボタンで操作が快適
    image: ""
    link: ""
    lines:
      - text: 第3位、Proコントローラー。
        yomi: 第三位、プロコントローラー。
      - text: 背面ボタンが付いて、アクションやシューティングが一気に快適に。
      - text: テレビで遊ぶ人なら満足度はかなり高いです。

  - rank: 2
    heading: 画面保護フィルム
    point: 7.9インチの大画面を守る
    image: ""
    link: ""
    lines:
      - text: 第2位、画面保護フィルム。
        yomi: 第二位、画面保護フィルム。
      - text: 7.9インチの大画面は、1回傷がつくとずっと気になる。
        yomi: 七点九インチの大画面は、一回傷がつくとずっと気になる。
      - text: 本体と同じ日に貼るのが正解です。

  - rank: 1
    heading: microSD Expressカード
    point: 普通のmicroSDは使えない！
    image: ""
    link: ""
    lines:
      - text: そして第1位、microSD Expressカード。
        yomi: そして第一位、マイクロエスディーエクスプレスカード。
      - text: Switch2のソフト保存は、microSD Expressにしか対応していません。
        yomi: スイッチツーのソフト保存は、マイクロエスディーエクスプレスにしか対応していません。
      - text: 前のSwitchで使っていたmicroSDでは代わりになりません。
        yomi: 前のスイッチで使っていたマイクロエスディーでは代わりになりません。
      - text: 本体容量256GBはすぐ埋まるので、これが一番大事！
        yomi: 本体容量二百五十六ギガはすぐ埋まるので、これが一番大事！

  - heading: みんなのオススメは？
    point: コメントで教えて！
    lines:
      - text: 紹介した商品は、概要欄とプロフィールのリンクからチェックしてね。
      - text: 他にもオススメがあったら、コメントで教えて！

