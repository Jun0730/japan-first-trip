# ─────────────────────────────────────────────
# 1本目：Switch2と一緒に買うべき周辺機器 5選
# ─────────────────────────────────────────────
# 画面は3種類
#   title  : 大きなタイトル。style は white（白）/ red（赤）/ yellow（黄）
#   rank   : 「番号＋名前」→ 青枠 → 紫枠 → 緑枠 → 赤枠 の順に出る。枠の中は「|」で改行
#            枠に page: true を書くと、そこで枠を消して上から並べ直す。color: red などで色を変えられる
#   ending : 最後の呼びかけ
# yomi      : 読み上げ用（読み間違えそうな時だけ書く。なければ画面の文字を読む）
# image     : shorts-maker/images/ に置いた画像のファイル名、または画像のURL（任意）
# image_search : 楽天市場で探すキーワード。image が空の時、一番上の商品の画像を使う（README 参照）
# speaker   : 声（3=ずんだもん、2=四国めたん）。台本全体・シーン・枠ごとに書ける
# link      : アフィリエイトリンク（概要欄テキストに入る）

# 投稿するときのタイトル（概要欄テキストにも入る）
title: Switch2買ったら…一緒に買わないと後悔する周辺機器５選！！

scenes:
  - type: title
    image: ""
    lines:
      - { text: "Switch2買ったら…", style: white }
      - { text: "一緒に買わないと", style: white }
      - { text: "後悔する", style: red }
      - { text: "周辺機器", style: red }
      - { text: "5選", style: yellow }
    narration: スイッチツー買ったら、一緒に買わないと後悔する周辺機器、五選！

  - rank: 5
    name: キャリングケース
    image: ""
    image_search: Nintendo Switch 2 キャリングケース
    link: ""
    boxes:
