name: ショート動画を作る

on:
  # Actions タブの「Run workflow」ボタンで実行
  workflow_dispatch:
    inputs:
      script:
        description: "作る台本（例: shorts-maker/scripts/001_switch2_accessories.yaml）。空白区切りで複数可。空なら全部作る"
        required: false
        default: ""
  # 台本・画像・BGMを更新してコミットしたら自動で作る（変わった台本だけ）
  push:
    paths:
      - "shorts-maker/**"
      - ".github/workflows/make-short.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # 「Run workflow」で全部作ると30本以上になるので長めにしておく
    timeout-minutes: 120
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          # push の前後を比べて、変わった台本を探すため
          fetch-depth: 0

      - name: ffmpeg と日本語フォントを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python ライブラリを入れる
        run: pip install -r shorts-maker/requirements.txt

      - name: VOICEVOX の起動を待つ
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:50021/version; then echo; echo "VOICEVOX OK"; exit 0; fi
            sleep 2
          done
          echo "VOICEVOX が起動しませんでした"; exit 1

      - name: 動画を作る
        env:
          SCRIPT: ${{ github.event.inputs.script }}
          # 商品画像を楽天から自動で取る時に使う（Settings → Secrets and variables → Actions に登録）
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # push の時は、追加・変更された台本だけを作る
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              SCRIPT=$(git diff --name-only --diff-filter=AMR "$BEFORE" "$GITHUB_SHA" -- 'shorts-maker/scripts/*.yaml' | tr '\n' ' ')
            fi
            # 台本が変わっていない（プログラムやBGMだけ変えた）時は、確認用に一番新しい台本を1本だけ作る
            if [ -z "$SCRIPT" ]; then
              SCRIPT=$(ls shorts-maker/scripts/*.yaml | sort | tail -1)
            fi
          fi
          echo "作る台本: ${SCRIPT:-全部}"
          python shorts-maker/make_video.py ${SCRIPT:-shorts-maker/scripts/*.yaml} --out out

      - name: 完成した動画をダウンロードできるようにする
        uses: actions/upload-artifact@v4
        with:
          name: shorts-videos
          path: out/
          retention-days: 30
